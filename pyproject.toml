[project]
name = "db-sentinel"
version = "0.1.0"
description = "Automated MySQL backup, verification and monitoring for on-premise environments"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Integration tests need a live MySQL server, so they are excluded by default.
# Run them explicitly with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requires a reachable MySQL server (deselected by default)",
]

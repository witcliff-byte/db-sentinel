---
# tasks file for roles/db_sentinel
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - python3
        state: present

    - name: Create /opt/db-sentinel
      ansible.builtin.file:
        path: /opt/db-sentinel
        state: directory
        mode: '0755'

    - name: Clone repo
      ansible.builtin.git:
        repo: https://github.com/witcliff-byte/db-sentinel.git
        dest: /opt/db-sentinel
        accept_hostkey: true

    - name: Deploy db-sentinel configuration
      ansible.builtin.template:
        src: templates/config.yml.j2
        dest: /opt/db-sentinel/config.yml
        mode: '0600'
      notify: Restart db-sentinel timer

    - name: Schedule nightly backup
      ansible.builtin.cron:
        name: "db-sentinel backup"
        hour: "2"
        minute: "0"
        job: "cd /opt/db-sentinel && .venv/bin/python scripts/run_backup.py >> /var/log/db-sentinel.log 2>&1"
        user: rocky-db
